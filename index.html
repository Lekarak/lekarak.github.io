<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Etiket Puanı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1E2B22;
    --paper: #FFFFFF;
    --butter: #F6D55C;
    --good: #2F7D3A;
    --mid: #C98A12;
    --bad: #B83227;
    --line: #DCE3DD;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: "Bricolage Grotesque", system-ui, sans-serif;
    font-size: 17px; line-height: 1.5;
  }
  main { max-width: 480px; margin: 0 auto; padding: 28px 20px 48px; }
  h1 { font-size: 2rem; font-weight: 800; line-height: 1.1; margin: 0 0 6px; }
  .intro { margin: 0 0 24px; color: #4A5A4F; }
  form { display: flex; gap: 8px; }
  input {
    flex: 1; font: inherit; font-size: 1.1rem; padding: 14px;
    border: 2px solid var(--ink); border-radius: 10px; letter-spacing: 0.04em;
  }
  button {
    font: inherit; font-weight: 600; padding: 14px 18px; border: 0;
    border-radius: 10px; background: var(--ink); color: var(--butter); cursor: pointer;
  }
  input:focus-visible, button:focus-visible { outline: 3px solid var(--butter); outline-offset: 2px; }
  #status { margin: 20px 0 0; min-height: 1.5em; }
  #result { display: none; margin-top: 20px; }
  .tag {
    display: flex; align-items: center; gap: 18px;
    padding: 18px; border-radius: 16px; background: var(--butter);
  }
  .score {
    font-size: 4.5rem; font-weight: 800; line-height: 1;
    min-width: 2ch; text-align: center; color: var(--paper);
    padding: 14px 12px; border-radius: 50%; aspect-ratio: 1;
    display: grid; place-items: center;
  }
  .score small { display: block; font-size: 0.9rem; font-weight: 600; }
  .name { font-weight: 600; font-size: 1.15rem; line-height: 1.25; }
  .brand { color: #4A5A4F; font-size: 0.95rem; }
  ul { list-style: none; padding: 0; margin: 20px 0; }
  li { padding: 10px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; }
  .pts { font-weight: 800; white-space: nowrap; }
  .minus { color: var(--bad); }
  .plus { color: var(--good); }
  details { margin-top: 8px; color: #4A5A4F; font-size: 0.95rem; }
  summary { cursor: pointer; font-weight: 600; color: var(--ink); }
  .note { margin-top: 28px; font-size: 0.85rem; color: #6B7A70; }
</style>
</head>
<body>
<main>
  <h1>Bu ürün kaç puan?</h1>
  <p class="intro">Barkod numarasını yaz, içindekiler Ray Peat kriterlerine göre 10 üzerinden puanlansın.</p>

  <form id="f">
    <input id="code" inputmode="numeric" placeholder="8690000000000" aria-label="Barkod numarası" required>
    <button type="submit">Puanla</button>
  </form>

  <p id="status" role="status"></p>

  <section id="result">
    <div class="tag">
      <div class="score" id="score"></div>
      <div>
        <div class="name" id="name"></div>
        <div class="brand" id="brand"></div>
      </div>
    </div>
    <ul id="reasons"></ul>
    <details>
      <summary>İçindekiler</summary>
      <p id="ingredients"></p>
    </details>
  </section>

  <p class="note">Puanlar Ray Peat kriterlerine göre verilir, tıbbi tavsiye değildir. Ürün bilgileri Open Food Facts'ten gelir.</p>
</main>

<script>
const has = (text, words) => words.some(w => text.includes(w));

function scoreProduct(ingredientsRaw) {
  let text = ingredientsRaw.toLocaleLowerCase("tr");
  const first = text.split(/[,;(]/)[0].trim();
  // "hindistan cevizi" ceviz sayılmasın
  const noCoconut = text.replace(/hindistan ?cevizi/g, "").replace(/coconut/g, "");
  let score = 10;
  const reasons = [];
  const add = (pts, label) => { score += pts; reasons.push({ pts, label }); };

  if (has(text, ["ayçiçek", "aycicek", "mısır yağı", "mısırözü yağı", "soya yağı", "kanola", "kolza",
                 "pamuk", "aspir", "bitkisel yağ", "sunflower", "corn oil", "soybean oil",
                 "rapeseed", "canola", "cottonseed", "safflower", "vegetable oil"]))
    add(-4, "Tohum yağı içeriyor");

  if (has(noCoconut, ["balık yağı", "keten", "chia", "ceviz", "fish oil", "flax", "linseed", "walnut"]))
    add(-2, "Omega-3 / PUFA kaynağı içeriyor");

  if (has(text, ["soya proteini", "soya lesitini", "soya unu", "soy protein", "soy lecithin", "soya fasulyesi"]))
    add(-1, "Soya içeriği var");

  const gums = [
    ["karragenan", "e407", "carrageenan"],
    ["guar", "e412"],
    ["ksantan", "e415", "xanthan"],
    ["keçiboynuzu", "e410", "locust bean"]
  ].filter(g => has(text, g)).length;
  if (gums > 0) add(-Math.min(gums, 2), "Kıvam artırıcı / zamk (" + gums + " adet)");

  if (has(text, ["aspartam", "sukraloz", "asesülfam", "sakarin", "e950", "e951", "e954", "e955",
                 "sucralose", "acesulfame", "saccharin"]))
    add(-1, "Yapay tatlandırıcı var");

  if (has(text, ["demir", "iron", "ferrous", "ferric"]))
    add(-1, "Demirle zenginleştirilmiş");

  if (/(^|\s)un(u)?(\s|$)|nişasta|flour|starch/.test(first))
    add(-1, "İlk içerik un veya nişasta");

  if (has(text, ["tereyağ", "hindistan cevizi yağı", "hindistancevizi yağı", "süt yağı", "butter", "coconut oil", "milk fat"]))
    add(1, "Tereyağı / hindistan cevizi / süt yağı");

  if (has(first, ["süt", "peynir", "yumurta", "jelatin", "meyve", "portakal", "elma",
                  "milk", "cheese", "egg", "gelatin", "fruit", "orange"]))
    add(1, "Ana içerik süt, yumurta, jelatin veya meyve");

  return { score: Math.max(0, Math.min(10, score)), reasons };
}

const $ = id => document.getElementById(id);

$("f").addEventListener("submit", async e => {
  e.preventDefault();
  const code = $("code").value.replace(/\D/g, "");
  if (!code) return;
  $("result").style.display = "none";
  $("status").textContent = "Ürün aranıyor…";

  try {
    const res = await fetch("https://world.openfoodfacts.org/api/v2/product/" + code +
      ".json?fields=product_name,product_name_tr,brands,ingredients_text_tr,ingredients_text");
    const data = await res.json();
    if (data.status !== 1) {
      $("status").textContent = "Bu barkod Open Food Facts'te kayıtlı değil. Numarayı kontrol et ya da başka bir ürün dene.";
      return;
    }
    const p = data.product;
    const ing = p.ingredients_text_tr || p.ingredients_text || "";
    if (!ing) {
      $("status").textContent = "Ürün bulundu ama içindekiler bilgisi eksik, bu yüzden puanlanamıyor.";
      return;
    }
    const { score, reasons } = scoreProduct(ing);
    const s = $("score");
    s.innerHTML = score + "<small>/10</small>";
    s.style.background = score >= 7 ? "var(--good)" : score >= 4 ? "var(--mid)" : "var(--bad)";
    $("name").textContent = p.product_name_tr || p.product_name || "İsimsiz ürün";
    $("brand").textContent = p.brands || "";
    $("reasons").innerHTML = reasons.length
      ? reasons.map(r => `<li><span>${r.label}</span><span class="pts ${r.pts < 0 ? "minus" : "plus"}">${r.pts > 0 ? "+" : ""}${r.pts}</span></li>`).join("")
      : "<li><span>Sorunlu içerik bulunmadı</span><span class='pts plus'>0</span></li>";
    $("ingredients").textContent = ing;
    $("status").textContent = "";
    $("result").style.display = "block";
  } catch {
    $("status").textContent = "Bağlantı kurulamadı. İnternetini kontrol edip tekrar dene.";
  }
});
</script>
</body>
</html>
